name: Deploy Landing Page to Simply.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: simply-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve FTP configuration
        id: ftp_config
        shell: bash
        env:
          SIMPLY_FTP_HOST: ${{ secrets.SIMPLY_FTP_HOST }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          SIMPLY_FTP_USERNAME: ${{ secrets.SIMPLY_FTP_USERNAME }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          SIMPLY_FTP_PASSWORD: ${{ secrets.SIMPLY_FTP_PASSWORD }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SIMPLY_REMOTE_DIR: ${{ secrets.SIMPLY_REMOTE_DIR }}
          SIMPLY_CASTVOLUME_REMOTE_DIR: ${{ secrets.SIMPLY_CASTVOLUME_REMOTE_DIR }}
        run: |
          ftp_host="${SIMPLY_FTP_HOST:-$FTP_SERVER}"
          ftp_user="${SIMPLY_FTP_USERNAME:-$FTP_USERNAME}"
          ftp_pass="${SIMPLY_FTP_PASSWORD:-$FTP_PASSWORD}"
          remote_dir="${SIMPLY_CASTVOLUME_REMOTE_DIR:-${SIMPLY_REMOTE_DIR:-/public_html/}}"

          if [ -z "${ftp_host}" ]; then
            echo "::error::Missing FTP host. Add SIMPLY_FTP_HOST or FTP_SERVER as a GitHub secret/variable."
            exit 1
          fi
          if [ -z "${ftp_user}" ]; then
            echo "::error::Missing FTP username. Add SIMPLY_FTP_USERNAME or FTP_USERNAME as a GitHub secret/variable."
            exit 1
          fi
          if [ -z "${ftp_pass}" ]; then
            echo "::error::Missing FTP password. Add SIMPLY_FTP_PASSWORD or FTP_PASSWORD as a GitHub secret/variable."
            exit 1
          fi

          echo "host=${ftp_host}" >> "${GITHUB_OUTPUT}"
          echo "user=${ftp_user}" >> "${GITHUB_OUTPUT}"
          echo "pass=${ftp_pass}" >> "${GITHUB_OUTPUT}"
          echo "remote_dir=${remote_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload to Simply.com via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp_config.outputs.host }}
          username: ${{ steps.ftp_config.outputs.user }}
          password: ${{ steps.ftp_config.outputs.pass }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ steps.ftp_config.outputs.remote_dir }}
          exclude: |
            **/.git*
            **/.github/**
            **/.DS_Store
